<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Julien Landuré</title>
  <meta name="description" content="{{description_plain}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description_plain}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:site_name" content="Julien Landuré">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description_plain}}">
  <meta name="twitter:image" content="{{og_image}}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="/slides/assets/viewer.css">
</head>
<body>
  <article class="deck-page" data-deck data-pdf="{{pdf_href}}" data-title="{{title_attr}}">
    <header class="player-chrome player-top">
      <a class="player-logo" href="/slides/">JL</a>
      <h1 class="player-title">{{title}}</h1>
      <a class="player-logo" href="/">Home</a>
    </header>
    <section class="player-chrome player-stage">
      <p class="status" data-status hidden></p>
      <canvas class="player-canvas" data-canvas></canvas>
      <div class="player-controls">
        <div class="player-nav">
          <button class="icon-btn" type="button" data-prev aria-label="Previous slide">‹</button>
          <button class="icon-btn" type="button" data-next aria-label="Next slide">›</button>
        </div>
        <div class="player-actions">
          <div class="share-menu" data-share-menu>
            <button class="icon-btn" type="button" data-share aria-label="Share">↗</button>
            <div class="share-panel">
              <button type="button" data-copy-link>Copy link</button>
              <a data-share-linkedin target="_blank" rel="noopener noreferrer">LinkedIn</a>
              <a data-share-bluesky target="_blank" rel="noopener noreferrer">Bluesky</a>
              <a data-share-x target="_blank" rel="noopener noreferrer">X</a>
            </div>
          </div>
          <button class="icon-btn" type="button" data-present aria-label="Slides only">▣</button>
          <button class="icon-btn" type="button" data-fullscreen aria-label="Fullscreen">⛶</button>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar" data-progress></div></div>
    </section>
    <div class="meta-bar">
      <div class="meta-author">
        <img class="avatar" src="/jlandure-450x450.jpg" alt="" width="28" height="28">
        <span>Julien Landuré</span>
        <time datetime="{{date_iso}}">{{date_label}}</time>
      </div>
      <div class="meta-actions">
        {{category_html}}
        <a href="{{pdf_href}}" download>Download PDF</a>
        <a href="{{canonical}}?present=1">Slides only</a>
      </div>
    </div>
    <div class="deck-body">
      <h1>{{title}}</h1>
      {{linkedin_html}}
      <div class="deck-description">{{description_html}}</div>
      <div class="deck-author">
        <img src="/jlandure-450x450.jpg" alt="" width="48" height="48">
        <div>
          <strong>Julien Landuré</strong>
          <div>{{date_label}}</div>
        </div>
      </div>
    </div>
  </article>
  {{more_decks_html}}
  <footer class="site-footer">
    <a href="/">jlandure.dev</a> · <a href="/slides/">All slides</a>
  </footer>
  <script type="module" src="/slides/assets/viewer.js"></script>
  <script>
    const url = location.href.split("#")[0];
    const encoded = encodeURIComponent(url);
    const title = encodeURIComponent(document.title);
    const linkedin = document.querySelector("[data-share-linkedin]");
    const bluesky = document.querySelector("[data-share-bluesky]");
    const x = document.querySelector("[data-share-x]");
    if (linkedin) linkedin.href = `https://www.linkedin.com/sharing/share-offsite/?url=${encoded}`;
    if (bluesky) bluesky.href = `https://bsky.app/intent/compose?text=${title}%20${encoded}`;
    if (x) x.href = `https://twitter.com/intent/tweet?url=${encoded}&text=${title}`;
  </script>
  <script async src="https://eu.umami.is/script.js" data-website-id="2f1e79be-313e-4f52-891f-c186ab603162"></script>
</body>
</html>
